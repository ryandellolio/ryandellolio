<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryan Dellolio</title>
  <meta name="description" content="Ryan Dellolio's GitHub profile README.">
  <link rel="canonical" href="https://ryan.dellol.io/">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --border: #3d444d;
        --link: #4493f8;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    main {
      max-width: 1012px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .profile img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .profile a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
    }
    .profile a:hover { text-decoration: underline; }
    .profile .login { color: var(--muted); font-size: 16px; }
    .box {
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .box-header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .box-header a { color: inherit; text-decoration: none; }
    .box-header a:hover { color: var(--link); text-decoration: underline; }
    .box-body { padding: 32px; }
    .markdown-body { background: transparent; }
    @media (max-width: 767px) {
      .box-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <a href="https://github.com/ryandellolio"><img src="https://github.com/ryandellolio.png?size=128" alt="" width="64" height="64"></a>
      <div>
        <a href="https://github.com/ryandellolio">Ryan Dellolio</a>
        <div class="login"><a href="https://github.com/ryandellolio" style="font-size:inherit;font-weight:400;color:inherit">ryandellolio</a></div>
      </div>
    </header>

    <div class="box">
      <div class="box-header">
        <a href="https://github.com/ryandellolio/ryandellolio">ryandellolio</a> /
        <a href="https://github.com/ryandellolio/ryandellolio/blob/main/README.md">README.md</a>
      </div>
      <div class="box-body">
        <article class="markdown-body">
<!-- README -->
        </article>
      </div>
    </div>
  </main>
</body>
</html>
